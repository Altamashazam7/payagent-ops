services:
  - type: keyvalue
    name: payagent-redis
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: payagent-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: 0.5c-512mb
    buildCommand: python -m pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payagent-ops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: payagent-redis
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        sync: false

  - type: web
    name: payagent-web
    runtime: node
    rootDir: frontend
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: PAYAGENT_API_URL
        value: https://payagent-api.onrender.com
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false

databases:
  - name: payagent-ops-db
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    databaseName: payagent_ops
    user: payagent_ops
    ipAllowList: []
